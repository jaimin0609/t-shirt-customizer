<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="UniQVerse - Customize your own unique t-shirts and apparel" />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="UniQVerse - Custom T-Shirt Design" />
    <meta property="og:description" content="Design and purchase your own custom apparel" />
    <meta property="og:type" content="website" />
    
    <!-- Preconnect to Google Fonts to improve load time -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Critical CSS loaded directly in head - not using dynamic path to ensure it's copied -->
    <link rel="stylesheet" href="/critical.css">
    
    <!-- Fallback CSS in case bundled CSS fails to load -->
    <link rel="stylesheet" href="/fallback.css">
    
    <!-- Inject inline critical CSS directly -->
    <style>
      /* Ensure basic Tailwind utilities are available immediately */
      .flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}
      .justify-center{justify-content:center}.w-full{width:100%}.text-center{text-align:center}
      .text-gray-700{color:#374151}.bg-white{background-color:#fff}
      body{margin:0;font-family:'Roboto','Montserrat',sans-serif}
    </style>
    
    <!-- Preload critical resources -->
    <link rel="preload" as="image" href="/logo.png">
    
    <!-- Force CSS reload in production with a timestamp -->
    <meta name="build-time" content="<%= Date.now() %>">
    
    <title>UniQVerse - Custom T-Shirt Design</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
