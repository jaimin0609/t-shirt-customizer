<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="UniQVerse - Customize your own unique t-shirts and apparel" />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="UniQVerse - Custom T-Shirt Design" />
    <meta property="og:description" content="Design and purchase your own custom apparel" />
    <meta property="og:type" content="website" />
    
    <!-- Add CDN React with specific version - MUST be before app script -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Backup CDN links from alternate CDN -->
    <script>
      // Ensure React is globally available
      if (!window.React) {
        console.warn('Loading React from backup CDN...');
        document.write('<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"><\/script>');
        document.write('<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"><\/script>');
      }
    </script>
    
    <!-- Add import map for ES modules -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/stable/react@18.2.0/es2022/react.mjs",
        "react-dom": "https://esm.sh/stable/react-dom@18.2.0/es2022/react-dom.mjs",
        "react-dom/client": "https://esm.sh/stable/react-dom@18.2.0/es2022/client.mjs",
        "react/jsx-runtime": "https://esm.sh/stable/react@18.2.0/es2022/jsx-runtime.mjs"
      }
    }
    </script>
    
    <!-- Add Tailwind CSS from CDN as fallback -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.3/dist/tailwind.min.css" rel="stylesheet">
    
    <!-- Additional CSS resets to ensure compatibility -->
    <style>
      /* Basic resets to ensure styles are applied correctly */
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
    </style>
    
    <!-- Preconnect to Google Fonts to improve load time -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Critical CSS loaded directly in head -->
    <link rel="stylesheet" href="/critical.css">
    
    <!-- Fallback CSS in case bundled CSS fails to load -->
    <link rel="stylesheet" href="/fallback.css">
    
    <!-- Verify React loaded properly -->
    <script>
      window.addEventListener('DOMContentLoaded', function() {
        if (!window.React || typeof window.React.createElement !== 'function') {
          console.error('React failed to load properly from CDN');
          document.getElementById('root').innerHTML = `
            <div style="padding: 20px; text-align: center; font-family: 'Roboto', sans-serif;">
              <h2 style="color: #e53e3e; margin-bottom: 16px;">React Loading Error</h2>
              <p>The application could not load React properly.</p>
              <button onclick="window.location.reload()" 
                      style="background-color: #4a6cf7; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">
                Reload Page
              </button>
            </div>
          `;
        }
      });
      
      // Auto-reload if page is stuck loading for too long
      setTimeout(function() {
        // Check if the app has loaded by looking for a specific element
        if (document.querySelector('.app-loading') && !document.querySelector('.app-loaded')) {
          console.log('App appears to be stuck loading, reloading page...');
          window.location.reload();
        }
      }, 30000);
      
      // Show error message after 15 seconds if app is still loading
      setTimeout(function() {
        var errorMessage = document.querySelector('.loading-error');
        if (errorMessage && document.querySelector('.app-loading')) {
          errorMessage.style.display = 'block';
        }
      }, 15000);
    </script>
    
    <!-- Inject inline critical CSS directly -->
    <style>
      /* Ensure basic Tailwind utilities are available immediately */
      .flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}
      .justify-center{justify-content:center}.w-full{width:100%}.text-center{text-align:center}
      .text-gray-700{color:#374151}.bg-white{background-color:#fff}
      body{margin:0;font-family:'Roboto','Montserrat',sans-serif}
      
      /* Add loading indicator styles */
      .app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        z-index: 9999;
      }
      .app-loading-spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #4a6cf7;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Add fallback error message style */
      .loading-error {
        display: none;
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        background-color: #fee2e2;
        border: 1px solid #ef4444;
        border-radius: 0.25rem;
        color: #b91c1c;
      }
    </style>
    
    <!-- Preload critical resources -->
    <link rel="preload" as="image" href="/logo.png">
    
    <title>UniQVerse - Custom T-Shirt Design</title>
  </head>
  <body>
    <div id="root">
      <!-- Initial loading state that will be replaced by React -->
      <div class="app-loading" id="initial-loading">
        <img src="/logo.png" alt="UniQVerse Logo" width="120" height="120">
        <div class="app-loading-spinner"></div>
        <p>Loading UniQVerse...</p>
        <div class="loading-error">
          Taking longer than expected. <button onclick="window.location.reload()">Refresh the page</button>
        </div>
      </div>
    </div>
    
    <!-- Main application script - must be after React CDN scripts -->
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Error detection and recovery -->
    <script>
      // This script fires if there's an issue loading our main bundle
      var scriptLoadError = false;
      
      window.addEventListener('error', function(event) {
        // Check if the error is related to script loading
        if (event.target && event.target.tagName === 'SCRIPT') {
          scriptLoadError = true;
          console.error('Script loading error:', event);
          
          // Show error message for script loading issues
          var errorMsg = document.querySelector('.loading-error');
          if (errorMsg) {
            errorMsg.innerHTML = `
              Error loading application scripts. Please <button onclick="window.location.reload()">refresh the page</button>
              or try clearing your browser cache.
            `;
            errorMsg.style.display = 'block';
          }
        }
      }, true); // Use capturing to catch the event
      
      // Final failsafe to ensure loader is removed
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loader = document.getElementById('initial-loading');
          if (loader && loader.parentNode) {
            console.log('Fallback: Removing loader after page load');
            loader.style.opacity = '0';
            setTimeout(function() {
              if (loader.parentNode) {
                loader.parentNode.removeChild(loader);
              }
            }, 500);
          }
        }, 5000);
      });
      
      // Also handle errors
      window.addEventListener('error', function(event) {
        console.error('Global error caught in index.html:', event.error);
        // Try to show something to the user
        setTimeout(function() {
          if (document.querySelector('.app-loading')) {
            var errorMsg = document.querySelector('.loading-error');
            if (errorMsg) {
              errorMsg.innerHTML = `
                Error loading application. Please <button onclick="window.location.reload()">refresh the page</button>.
                <br><small style="font-size: 0.8em; color: #777;">${event.message || 'Unknown error'}</small>
              `;
              errorMsg.style.display = 'block';
            }
          }
        }, 1000);
      });
    </script>
  </body>
</html>
