<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="UniQVerse - Customize your own unique t-shirts and apparel" />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="UniQVerse - Custom T-Shirt Design" />
    <meta property="og:description" content="Design and purchase your own custom apparel" />
    <meta property="og:type" content="website" />
    
    <!-- Force reloading if stuck for over 30 seconds -->
    <script>
      // Auto-reload if page is stuck loading for too long
      setTimeout(function() {
        // Check if the app has loaded by looking for a specific element
        if (document.querySelector('.app-loading') && !document.querySelector('.app-loaded')) {
          console.log('App appears to be stuck loading, reloading page...');
          window.location.reload();
        }
      }, 30000);
    </script>
    
    <!-- Preconnect to Google Fonts to improve load time -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Critical CSS loaded directly in head -->
    <link rel="stylesheet" href="/critical.css">
    
    <!-- Fallback CSS in case bundled CSS fails to load -->
    <link rel="stylesheet" href="/fallback.css">
    
    <!-- Inject inline critical CSS directly -->
    <style>
      /* Ensure basic Tailwind utilities are available immediately */
      .flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}
      .justify-center{justify-content:center}.w-full{width:100%}.text-center{text-align:center}
      .text-gray-700{color:#374151}.bg-white{background-color:#fff}
      body{margin:0;font-family:'Roboto','Montserrat',sans-serif}
      
      /* Add loading indicator styles */
      .app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        z-index: 9999;
      }
      .app-loading-spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #4a6cf7;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Add fallback error message style */
      .loading-error {
        display: none;
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        background-color: #fee2e2;
        border: 1px solid #ef4444;
        border-radius: 0.25rem;
        color: #b91c1c;
      }
      
      /* Show error message after 15 seconds if app is still loading */
      setTimeout(function() {
        const errorMessage = document.querySelector('.loading-error');
        if (errorMessage && document.querySelector('.app-loading')) {
          errorMessage.style.display = 'block';
        }
      }, 15000);
    </style>
    
    <!-- Preload critical resources -->
    <link rel="preload" as="image" href="/logo.png">
    
    <!-- Force CSS reload in production with a timestamp -->
    <meta name="build-time" content="<%= Date.now() %>">
    
    <title>UniQVerse - Custom T-Shirt Design</title>
  </head>
  <body>
    <div id="root">
      <!-- Initial loading state that will be replaced by React -->
      <div class="app-loading" id="initial-loading">
        <img src="/logo.png" alt="UniQVerse Logo" width="120" height="120">
        <div class="app-loading-spinner"></div>
        <p>Loading UniQVerse...</p>
        <div class="loading-error">
          Taking longer than expected. <button onclick="window.location.reload()">Refresh the page</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Fallback script to remove loader if main script fails -->
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loader = document.getElementById('initial-loading');
          if (loader) {
            console.log('Fallback: Attempting to remove loader after window load');
            loader.style.opacity = '0';
            setTimeout(function() {
              if (loader.parentNode) {
                loader.parentNode.removeChild(loader);
              }
            }, 500);
          }
        }, 5000); // Give the app 5 seconds to initialize
      });
    </script>
  </body>
</html>
