<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Setup - T-Shirt Customizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .setup-container {
            max-width: 600px;
            width: 100%;
            padding: 2rem;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        .setup-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .setup-logo img {
            max-width: 150px;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
            border-color: #86b7fe;
        }
        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
            border-color: #0a58ca;
        }
    </style>
</head>
<body>
    <div class="setup-container">
        <div class="setup-logo">
            <h2>T-Shirt Customizer</h2>
            <p class="text-muted">First-Time Admin Setup</p>
        </div>
        
        <div class="alert alert-info mb-4">
            <i class="bi bi-info-circle-fill me-2"></i>
            <span>Welcome! This page will help you set up your administrator account.</span>
        </div>
        
        <form id="setupForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="form-text">Choose a unique username (e.g., admin)</div>
            </div>
            
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="form-text">This email will be used for account recovery</div>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" required>
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <div class="form-text">Must be at least 8 characters long</div>
            </div>
            
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                </div>
            </div>
            
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Create Admin Account</button>
            </div>
            
            <div id="setupError" class="alert alert-danger mt-3" style="display: none;"></div>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        });
        
        // Handle form submission
        document.getElementById('setupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorElement = document.getElementById('setupError');
            
            // Validate passwords match
            if (password !== confirmPassword) {
                errorElement.textContent = 'Passwords do not match';
                errorElement.style.display = 'block';
                return;
            }
            
            // Reset error
            errorElement.style.display = 'none';
            
            try {
                // Check if setup is needed
                const checkResponse = await fetch('/api/auth/check-setup');
                const checkData = await checkResponse.json();
                
                if (!checkData.needsSetup) {
                    errorElement.textContent = 'Admin account already exists. Please go to the login page.';
                    errorElement.style.display = 'block';
                    
                    // Add a button to redirect to login
                    const redirectBtn = document.createElement('button');
                    redirectBtn.className = 'btn btn-primary mt-3';
                    redirectBtn.textContent = 'Go to Login';
                    redirectBtn.onclick = () => window.location.href = '/admin/login.html';
                    errorElement.appendChild(document.createElement('br'));
                    errorElement.appendChild(redirectBtn);
                    return;
                }
                
                // Submit setup form
                const response = await fetch('/api/auth/first-time-setup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        name,
                        email,
                        password
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.message || 'Failed to create admin account');
                }
                
                // Store token and user data
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                localStorage.setItem('isAdminSession', 'true');
                
                // Redirect to dashboard
                window.location.href = '/admin/index.html';
                
            } catch (error) {
                console.error('Setup error:', error);
                errorElement.textContent = error.message || 'An error occurred during setup';
                errorElement.style.display = 'block';
            }
        });
        
        // Check if admin setup is needed when page loads
        async function checkSetupStatus() {
            try {
                const response = await fetch('/api/auth/check-setup');
                const data = await response.json();
                
                if (!data.needsSetup) {
                    window.location.href = '/admin/login.html';
                }
            } catch (error) {
                console.error('Error checking setup status:', error);
            }
        }
        
        // Run check on page load
        checkSetupStatus();
    </script>
</body>
</html>
