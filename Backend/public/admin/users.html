<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - T-Shirt Customizer Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Include sidebar navigation -->
            <div id="sidebarContainer" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse"></div>
            
            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">User Management</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <button id="createUserBtn" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-person-plus"></i> Add New User
                        </button>
                    </div>
                </div>
                
                <!-- Users table -->
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <!-- User data will be loaded here -->
                            <tr>
                                <td colspan="7" class="text-center">Loading users...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    
    <!-- Create/Edit User Modal -->
    <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="userModalLabel">Add New User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="userForm">
                        <input type="hidden" id="userId">
                        
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        
                        <div class="mb-3 password-field">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                            <div class="form-text">Must be at least 8 characters long</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="role" class="form-label">Role</label>
                            <select class="form-select" id="role" required>
                                <option value="admin">Admin</option>
                                <option value="manager">Manager</option>
                                <option value="editor">Editor</option>
                                <option value="user">User</option>
                            </select>
                        </div>
                        
                        <div class="mb-3 status-field">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                                <option value="suspended">Suspended</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveUserBtn">Save</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Reset Password Modal -->
    <div class="modal fade" id="resetPasswordModal" tabindex="-1" aria-labelledby="resetPasswordModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="resetPasswordModalLabel">Reset Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="resetPasswordForm">
                        <input type="hidden" id="resetUserId">
                        
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">New Password</label>
                            <input type="password" class="form-control" id="newPassword" required>
                            <div class="form-text">Must be at least 8 characters long</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
                            <input type="password" class="form-control" id="confirmNewPassword" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="resetPasswordBtn">Reset Password</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Confirmation Modal -->
    <div class="modal fade" id="confirmationModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Action</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="confirmationMessage">Are you sure you want to proceed with this action?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmActionBtn">Confirm</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
        // Load sidebar
        document.addEventListener('DOMContentLoaded', function() {
            loadSidebar('users');
            
            // Load users
            loadUsers();
            
            // Set up button event listeners
            document.getElementById('createUserBtn').addEventListener('click', showCreateUserModal);
            document.getElementById('saveUserBtn').addEventListener('click', saveUser);
            document.getElementById('resetPasswordBtn').addEventListener('click', resetPassword);
            
            // Set up permissions check
            checkPermissions();
        });
        
        // Function to check user permissions
        async function checkPermissions() {
            const user = JSON.parse(localStorage.getItem('user'));
            
            // If user is not admin, redirect to dashboard
            if (user.role !== 'admin') {
                alert('You do not have permission to access this page');
                window.location.href = 'index.html';
            }
        }
        
        // Function to load users
        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/users', {
                    headers: getAuthHeaders()
                });
                
                if (!response.ok) {
                    throw new Error('Failed to load users');
                }
                
                const users = await response.json();
                
                // Populate table
                const tableBody = document.getElementById('usersTableBody');
                tableBody.innerHTML = '';
                
                if (users.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="7" class="text-center">No users found</td></tr>';
                    return;
                }
                
                users.forEach(user => {
                    const tr = document.createElement('tr');
                    
                    tr.innerHTML = `
                        <td>${user.id}</td>
                        <td>${user.username}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td><span class="badge bg-${getRoleBadgeClass(user.role)}">${user.role}</span></td>
                        <td><span class="badge bg-${getStatusBadgeClass(user.status)}">${user.status || 'active'}</span></td>
                        <td class="actions">
                            <button class="btn btn-sm btn-outline-primary edit-user" data-id="${user.id}">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-warning reset-password" data-id="${user.id}">
                                <i class="bi bi-key"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger delete-user" data-id="${user.id}">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    `;
                    
                    tableBody.appendChild(tr);
                });
                
                // Add event listeners for action buttons
                addActionEventListeners();
                
            } catch (error) {
                console.error('Error loading users:', error);
                alert('Failed to load users: ' + error.message);
            }
        }
        
        // Function to add event listeners to action buttons
        function addActionEventListeners() {
            // Edit buttons
            document.querySelectorAll('.edit-user').forEach(button => {
                button.addEventListener('click', function() {
                    const userId = this.getAttribute('data-id');
                    showEditUserModal(userId);
                });
            });
            
            // Reset password buttons
            document.querySelectorAll('.reset-password').forEach(button => {
                button.addEventListener('click', function() {
                    const userId = this.getAttribute('data-id');
                    showResetPasswordModal(userId);
                });
            });
            
            // Delete buttons
            document.querySelectorAll('.delete-user').forEach(button => {
                button.addEventListener('click', function() {
                    const userId = this.getAttribute('data-id');
                    confirmDeleteUser(userId);
                });
            });
        }
        
        // Function to show create user modal
        function showCreateUserModal() {
            // Reset form
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('userModalLabel').textContent = 'Add New User';
            
            // Show password field (it's required for new users)
            document.querySelector('.password-field').style.display = 'block';
            document.getElementById('password').required = true;
            
            // Hide status field (new users are always active)
            document.querySelector('.status-field').style.display = 'none';
            
            // Set default role
            document.getElementById('role').value = 'user';
            
            // Show modal
            const userModal = new bootstrap.Modal(document.getElementById('userModal'));
            userModal.show();
        }
        
        // Function to show edit user modal
        async function showEditUserModal(userId) {
            try {
                // Fetch user data
                const response = await fetch(`/api/admin/users/${userId}`, {
                    headers: getAuthHeaders()
                });
                
                if (!response.ok) {
                    throw new Error('Failed to load user data');
                }
                
                const user = await response.json();
                
                // Populate form
                document.getElementById('userId').value = user.id;
                document.getElementById('username').value = user.username;
                document.getElementById('name').value = user.name;
                document.getElementById('email').value = user.email;
                document.getElementById('role').value = user.role;
                document.getElementById('status').value = user.status || 'active';
                
                // Hide password field (it's not required for editing)
                document.querySelector('.password-field').style.display = 'none';
                document.getElementById('password').required = false;
                
                // Show status field
                document.querySelector('.status-field').style.display = 'block';
                
                // Update modal title
                document.getElementById('userModalLabel').textContent = 'Edit User';
                
                // Show modal
                const userModal = new bootstrap.Modal(document.getElementById('userModal'));
                userModal.show();
                
            } catch (error) {
                console.error('Error loading user data:', error);
                alert('Failed to load user data: ' + error.message);
            }
        }
        
        // Function to save user (create or update)
        async function saveUser() {
            try {
                const userId = document.getElementById('userId').value;
                const isNewUser = !userId;
                
                // Get form data
                const userData = {
                    username: document.getElementById('username').value,
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    role: document.getElementById('role').value
                };
                
                // Add password for new users
                if (isNewUser) {
                    userData.password = document.getElementById('password').value;
                } else {
                    // Add status for existing users
                    userData.status = document.getElementById('status').value;
                }
                
                // Send request
                const url = isNewUser 
                    ? '/api/admin/users'
                    : `/api/admin/users/${userId}`;
                    
                const method = isNewUser ? 'POST' : 'PUT';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        ...getAuthHeaders()
                    },
                    body: JSON.stringify(userData)
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Failed to save user');
                }
                
                // Close modal
                bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
                
                // Reload users
                loadUsers();
                
                // Show success message
                alert(isNewUser ? 'User created successfully' : 'User updated successfully');
                
            } catch (error) {
                console.error('Error saving user:', error);
                alert('Failed to save user: ' + error.message);
            }
        }
        
        // Function to show reset password modal
        function showResetPasswordModal(userId) {
            // Reset form
            document.getElementById('resetPasswordForm').reset();
            document.getElementById('resetUserId').value = userId;
            
            // Show modal
            const resetPasswordModal = new bootstrap.Modal(document.getElementById('resetPasswordModal'));
            resetPasswordModal.show();
        }
        
        // Function to reset password
        async function resetPassword() {
            try {
                const userId = document.getElementById('resetUserId').value;
                const newPassword = document.getElementById('newPassword').value;
                const confirmNewPassword = document.getElementById('confirmNewPassword').value;
                
                // Validate passwords match
                if (newPassword !== confirmNewPassword) {
                    alert('Passwords do not match');
                    return;
                }
                
                // Send request
                const response = await fetch(`/api/admin/users/${userId}/reset-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...getAuthHeaders()
                    },
                    body: JSON.stringify({ newPassword })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Failed to reset password');
                }
                
                // Close modal
                bootstrap.Modal.getInstance(document.getElementById('resetPasswordModal')).hide();
                
                // Show success message
                alert('Password reset successfully');
                
            } catch (error) {
                console.error('Error resetting password:', error);
                alert('Failed to reset password: ' + error.message);
            }
        }
        
        // Function to confirm user deletion
        function confirmDeleteUser(userId) {
            // Set confirmation message and action
            document.getElementById('confirmationMessage').textContent = 'Are you sure you want to delete this user? This action cannot be undone.';
            
            document.getElementById('confirmActionBtn').onclick = function() {
                deleteUser(userId);
                bootstrap.Modal.getInstance(document.getElementById('confirmationModal')).hide();
            };
            
            // Show modal
            const confirmationModal = new bootstrap.Modal(document.getElementById('confirmationModal'));
            confirmationModal.show();
        }
        
        // Function to delete user
        async function deleteUser(userId) {
            try {
                // Send request
                const response = await fetch(`/api/admin/users/${userId}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Failed to delete user');
                }
                
                // Reload users
                loadUsers();
                
                // Show success message
                alert('User deleted successfully');
                
            } catch (error) {
                console.error('Error deleting user:', error);
                alert('Failed to delete user: ' + error.message);
            }
        }
        
        // Helper function to get role badge class
        function getRoleBadgeClass(role) {
            switch (role) {
                case 'admin': return 'danger';
                case 'manager': return 'warning';
                case 'editor': return 'info';
                default: return 'secondary';
            }
        }
        
        // Helper function to get status badge class
        function getStatusBadgeClass(status) {
            switch (status) {
                case 'active': return 'success';
                case 'inactive': return 'secondary';
                case 'suspended': return 'danger';
                default: return 'secondary';
            }
        }
    </script>
</body>
</html>
