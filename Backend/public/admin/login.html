<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - T-Shirt Customizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo img {
            max-width: 150px;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
            border-color: #86b7fe;
        }
        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
            border-color: #0a58ca;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <h2>T-Shirt Customizer</h2>
            <p class="text-muted">Admin Dashboard</p>
        </div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
                </div>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                </div>
            </div>
            
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
                <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>
            
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
            
            <div id="loginError" class="alert alert-danger mt-3" style="display: none;"></div>
            <div id="loginDebug" class="alert alert-info mt-2" style="display: none;"></div>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Define API URL
        const API_URL = '/api';
        
        // Check for error parameters in URL
        document.addEventListener('DOMContentLoaded', function() {
            // Clear any existing tokens to prevent login issues
            localStorage.removeItem('token');
            localStorage.removeItem('isAdminSession');
            
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            if (error) {
                const errorElement = document.getElementById('loginError');
                if (error === 'session_expired') {
                    errorElement.textContent = 'Your session has expired. Please log in again.';
                } else if (error === 'auth_required') {
                    errorElement.textContent = 'Authentication required. Please log in.';
                } else if (error === 'logout_failed') {
                    errorElement.textContent = 'Logout process encountered an issue. Please try logging in again.';
                } else {
                    errorElement.textContent = 'An error occurred. Please try logging in again.';
                }
                errorElement.style.display = 'block';
            }
        });

        // Check if already logged in
        async function checkAdminAuth() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const response = await fetch(`${API_URL}/auth/verify-admin`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (response.ok) {
                        window.location.href = '/admin/index.html';
                    }
                } catch (error) {
                    console.error('Auth check failed:', error);
                }
            }
        }

        // Check auth on page load
        document.addEventListener('DOMContentLoaded', function() {
            checkSetupStatus();
            checkAdminAuth();
        });

        // Add function to check if setup is needed
        async function checkSetupStatus() {
            try {
                const response = await fetch('/api/auth/check-setup');
                const data = await response.json();
                
                if (data.needsSetup) {
                    console.log('First-time setup needed. Redirecting to setup page...');
                    window.location.href = '/admin/setup.html';
                }
            } catch (error) {
                console.error('Error checking setup status:', error);
            }
        }
        
        // Regular login form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const debugInfo = document.getElementById('loginDebug');
            const loginButton = document.querySelector('button[type="submit"]');
            
            // Disable login button to prevent multiple submissions
            loginButton.disabled = true;
            loginButton.textContent = 'Logging in...';
            
            try {
                console.log('Attempting login with:', email);
                debugInfo.innerHTML = `<p>Attempting login for: ${email}</p>`;
                debugInfo.style.display = 'block';
                
                // Add origin information to help debug CORS issues
                const originInfo = {
                    origin: window.location.origin,
                    pathname: window.location.pathname
                };
                console.log('Request origin:', originInfo);
                debugInfo.innerHTML += `<p>From: ${originInfo.origin}</p>`;
                
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        email, 
                        password,
                        isAdminLogin: true // Add this flag for admin login
                    }),
                    // Ensure credentials are included
                    credentials: 'include'
                });
                
                const responseData = await response.json();
                debugInfo.innerHTML += `<p>Server status: ${response.status}</p>`;
                
                if (!response.ok) {
                    // Add debug information
                    debugInfo.innerHTML += `<p>Error: ${responseData.message || 'Unknown error'}</p>`;
                    
                    // Special handling for CORS errors
                    if (response.status === 403 && responseData.message && responseData.message.includes('untrusted origin')) {
                        debugInfo.innerHTML += `<p class="text-danger">CORS Error: Your browser is blocking the request due to security settings.</p>`;
                        debugInfo.innerHTML += `<p>Try accessing this page directly via the server URL instead of through a proxy.</p>`;
                    }
                    
                    // Re-enable login button
                    loginButton.disabled = false;
                    loginButton.textContent = 'Login';
                    
                    throw new Error(responseData.message || 'Login failed');
                }
                
                const data = responseData;
                
                // Verify admin role
                if (data.user.role !== 'admin') {
                    debugInfo.innerHTML += '<p>Error: User is not an admin</p>';
                    
                    // Re-enable login button
                    loginButton.disabled = false;
                    loginButton.textContent = 'Login';
                    
                    throw new Error('Access denied. Admin privileges required.');
                }
                
                // Store token and user data
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                localStorage.setItem('isAdminSession', 'true'); // Flag for admin session
                
                // Set token expiration for automatic logout
                const jwt = parseJwt(data.token);
                if (jwt && jwt.exp) {
                    localStorage.setItem('tokenExpiration', jwt.exp * 1000);
                }
                
                // Redirect to dashboard
                debugInfo.innerHTML += '<p>Login successful, redirecting...</p>';
                window.location.href = '/admin/index.html';
            } catch (error) {
                console.error('Login error:', error);
                const errorElement = document.getElementById('loginError');
                errorElement.textContent = error.message;
                errorElement.style.display = 'block';
                
                // Re-enable login button
                loginButton.disabled = false;
                loginButton.textContent = 'Login';
            }
        });
        
        // Helper function to parse JWT token
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                console.error('Error parsing JWT:', e);
                return null;
            }
        }
    </script>
</body>
</html>
